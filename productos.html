<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>Colección — YAS DRIP</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div id="site-header"></div>

<section class="section" id="coleccion">
  <div class="section-head reveal">
    <div>
      <div class="section-eyebrow">Catálogo completo</div>
      <h2>La colección <span class="hero-note" style="font-size:0.55em;transform:rotate(-3deg);">psst, se acaba rápido</span></h2>
    </div>
    <p>Elige color y talla directo en la tarjeta.</p>
  </div>

  <div class="filters" id="filters"></div>

  <div class="grid" id="productGrid"></div>
</section>

<div id="site-footer"></div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastText">¡Sumado a tu pedido!</span></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/icons.js"></script>
<script src="js/products.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>
renderHeader('productos');
renderFooter();

(async function () {
await cargarCatalogo(); // trae el catálogo de Firestore antes de pintar nada

const params = new URLSearchParams(window.location.search);
const filtroInicial = params.get('cat') || 'todos';
const generoInicial = params.get('genero') || null;
const productosBase = productosActivos();
const productos = generoInicial
  ? productosBase.filter(p => Array.isArray(p.genero) && p.genero.includes(generoInicial))
  : productosBase;
const categorias = Array.from(new Set(productos.map(p => p.categoria))).sort();
const etiquetaGenero = { hombre: 'Hombre', mujer: 'Mujer', nino: 'Niño', nina: 'Niña' }[generoInicial] || null;

if (etiquetaGenero) {
  document.querySelector('.section-eyebrow').textContent = 'Colección · ' + etiquetaGenero;
}

/* ---- construir botones de filtro ---- */
const filtersEl = document.getElementById('filters');
let filtrosHtml = `<button class="filter-btn ${filtroInicial === 'todos' ? 'active' : ''}" data-cat="todos">Todos</button>`;
categorias.forEach(cat => {
  filtrosHtml += `<button class="filter-btn ${filtroInicial === cat ? 'active' : ''}" data-cat="${cat}">${cat}</button>`;
});
filtersEl.innerHTML = filtrosHtml;

/* ---- construir tarjetas de producto ---- */
const gridEl = document.getElementById('productGrid');

if (productos.length === 0) {
  gridEl.innerHTML = `<div class="empty-state"><p>El próximo drop está por caer. Vuelve pronto ⚡</p></div>`;
} else {
  gridEl.innerHTML = productos.map((p, i) => {
    const revealDelay = `reveal-d${(i % 6) + 1}`;
    const stockNum = stockTotalProducto(p);
    const sinStock = stockNum <= 0;
    const descuento = Number(p.descuento) || 0;
    const badge = badgeInfo(sinStock ? 'agotado' : p.badge);
    const oculto = (filtroInicial !== 'todos' && filtroInicial !== p.categoria) ? 'hidden' : '';
    const badgeHtml = badge ? `<div class="badge ${badge.class}">${badge.label}</div>` : '';
    /* primer color con stock disponible (si todos están agotados, cae en el primero) */
    const colorInicial = p.colores.find(c => !colorAgotado(p, c)) || p.colores[0];
    const swatchesHtml = p.colores.map((c) => {
      const agotadoColor = colorAgotado(p, c);
      return `<div class="swatch ${c === colorInicial ? 'active' : ''} ${agotadoColor ? 'swatch-agotado' : ''}" style="background:${c}" data-color="${c}" title="${agotadoColor ? 'Agotado en este color' : ''}"></div>`;
    }).join('');
    const sizesHtml = p.tallas.map(sz => {
      const agotadaSz = tallaAgotada(p, sz);
      return `<div class="size-chip ${agotadaSz ? 'size-chip-agotado' : ''}" data-size="${sz}" title="${agotadaSz ? 'Agotada' : ''}">${sz}</div>`;
    }).join('');
    /* foto a mostrar de entrada: la del primer color con stock, si no la foto general, si no el dibujo */
    const fotoInicial = (p.fotos && p.fotos[colorInicial]) || p.foto || null;
    /* foto de espaldas de ese color (opcional): si existe, al pasar el
       mouse (o tocar en celular) sobre la tarjeta se muestra esa foto
       para que el cliente vea cómo luce la prenda por detrás */
    const fotoTraseraInicial = (p.fotosTrasera && p.fotosTrasera[colorInicial]) || null;
    const precioTachado = descuento > 0 ? p.precio : p.precio_anterior;
    const precioAnteriorHtml = precioTachado
      ? `<span class="old">$${Number(precioTachado).toLocaleString('es-CO')}</span>` : '';
    const descuentoHtml = descuento > 0 ? `<span class="chip-descuento">-${descuento}%</span>` : '';
    const stockColorInicial = stockColor(p, colorInicial);
    const stockNoteHtml = (!sinStock && stockColorInicial <= 5)
      ? `<div class="stock-note" data-stock-note>¡Quedan ${stockColorInicial}!</div>` : `<div class="stock-note" data-stock-note style="display:none;"></div>`;
    /* si las tallas tienen precios distintos, mostramos "Desde $X" hasta que
       el cliente elija una talla puntual */
    const rango = rangoPrecioTallas(p);
    const precioMostradoInicial = rango.min === rango.max
      ? `$${rango.min.toLocaleString('es-CO')}`
      : `Desde $${rango.min.toLocaleString('es-CO')}`;

    return `
      <div class="card reveal ${revealDelay} ${oculto} ${sinStock ? 'sin-stock' : ''}" id="${p.id}" data-cat="${p.categoria}" data-stock="${stockNum}" data-product>
        <div class="card-media" data-media style="background:${colorInicial}22">
          ${badgeHtml}
          ${fotoInicial
            ? `<img src="${fotoInicial}" class="card-photo" data-photo alt="${p.nombre}" loading="lazy" decoding="async">`
            : `<div data-icon>${iconoProducto(p.icono, colorInicial)}</div>`}
          ${fotoTraseraInicial ? `<img src="${fotoTraseraInicial}" class="card-photo card-photo-trasera" data-photo-trasera alt="${p.nombre} de espaldas" loading="lazy" decoding="async">` : ''}
        </div>
        <div class="card-body">
          <div class="card-cat">${p.categoria}</div>
          <div class="card-name display">${p.nombre}</div>
          <div class="swatches">${swatchesHtml}</div>
          <div class="sizes">${sizesHtml}</div>
          ${stockNoteHtml}
          <div class="card-bottom">
            <div class="card-price mono">${precioAnteriorHtml} <span data-price-num>${precioMostradoInicial}</span> ${descuentoHtml}</div>
            <button class="add-btn" data-id="${p.id}" data-nombre="${p.nombre}" ${sinStock ? 'disabled' : ''}>${sinStock ? 'Agotado' : 'Lo quiero'}</button>
          </div>
        </div>
      </div>`;
  }).join('');
}

// Las tarjetas se acaban de pintar (llegaron de Firestore), así
// que hay que decirle al observador de scroll que las revise.
initScrollReveal();

/* ---- filtros de categoría (100% en el cliente) ---- */
filtersEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  [...filtersEl.children].forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const cat = btn.dataset.cat;
  document.querySelectorAll('[data-product]').forEach(card => {
    card.classList.toggle('hidden', cat !== 'todos' && card.dataset.cat !== cat);
  });
});

/* ---- estado de color/talla elegidos por tarjeta ---- */
const seleccion = {};

document.querySelectorAll('[data-product]').forEach(card => {
  const id = card.id;
  seleccion[id] = { color: card.querySelector('.swatch.active')?.dataset.color || card.querySelector('.swatch')?.dataset.color || null, talla: null };

  function refrescarAvisoStock() {
    const producto = buscarProducto(id);
    const colorElegido = seleccion[id].color;
    const noteEl = card.querySelector('[data-stock-note]');
    const addBtn = card.querySelector('.add-btn');
    if (!producto || !noteEl) return;
    const stockDeEseColor = stockColor(producto, colorElegido);
    if (colorAgotado(producto, colorElegido)) {
      noteEl.textContent = 'Agotado en este color';
      noteEl.style.display = 'block';
      noteEl.classList.add('stock-note-agotado');
      if (addBtn) { addBtn.disabled = true; addBtn.textContent = 'Agotado en este color'; }
    } else {
      noteEl.classList.remove('stock-note-agotado');
      if (addBtn) { addBtn.disabled = false; addBtn.textContent = 'Lo quiero'; }
      if (stockDeEseColor <= 5) {
        noteEl.textContent = `¡Quedan ${stockDeEseColor}!`;
        noteEl.style.display = 'block';
      } else {
        noteEl.style.display = 'none';
      }
    }
  }
  refrescarAvisoStock();

  /* en celular no existe el "hover" del mouse, así que un toque sobre
     la foto alterna entre la vista de adelante y la de espaldas
     (si el producto tiene foto trasera para el color elegido) */
  const mediaEl = card.querySelector('[data-media]');
  mediaEl.addEventListener('click', () => {
    if (card.querySelector('[data-photo-trasera]')) {
      card.classList.toggle('card-trasera-activa');
    }
  });

  card.querySelectorAll('.swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      card.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      const colorElegido = sw.dataset.color;
      seleccion[id].color = colorElegido;
      card.querySelectorAll('[data-icon] svg path[fill]').forEach(path => {
        path.setAttribute('fill', colorElegido);
      });
      card.querySelector('[data-media]').style.background = colorElegido + '22';

      /* si el producto tiene una foto real para este color, la mostramos,
         y lo mismo con la foto de espaldas (si existe) */
      const producto = buscarProducto(id);
      const imgEl = card.querySelector('[data-photo]');
      if (imgEl && producto) {
        const fotoDelColor = (producto.fotos && producto.fotos[colorElegido]) || producto.foto;
        if (fotoDelColor) imgEl.src = fotoDelColor;
      }
      const imgTraseraEl = card.querySelector('[data-photo-trasera]');
      const fotoTraseraDelColor = producto && producto.fotosTrasera && producto.fotosTrasera[colorElegido];
      if (fotoTraseraDelColor) {
        if (imgTraseraEl) {
          imgTraseraEl.src = fotoTraseraDelColor;
        } else {
          card.querySelector('[data-media]').insertAdjacentHTML('beforeend',
            `<img src="${fotoTraseraDelColor}" class="card-photo card-photo-trasera" data-photo-trasera alt="${producto.nombre} de espaldas" loading="lazy" decoding="async">`);
        }
      } else if (imgTraseraEl) {
        imgTraseraEl.remove();
      }
      refrescarAvisoStock();
    });
  });

  card.querySelectorAll('.size-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const producto = buscarProducto(id);
      if (producto && tallaAgotada(producto, chip.dataset.size)) {
        showToast(`Talla ${chip.dataset.size} agotada por ahora.`, true);
        return;
      }
      card.querySelectorAll('.size-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      seleccion[id].talla = chip.dataset.size;

      /* si esa talla tiene un precio propio, actualizamos el precio mostrado */
      const priceEl = card.querySelector('[data-price-num]');
      if (producto && priceEl) {
        const finalTalla = precioConDescuentoTalla(producto, chip.dataset.size);
        priceEl.textContent = `$${Number(finalTalla).toLocaleString('es-CO')}`;
      }
    });
  });
});

/* ---- añadir al carrito (antes era fetch a ajax/agregar_carrito.php, ahora es local) ---- */
document.querySelectorAll('.add-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const card = btn.closest('[data-product]');
    const id = card.id;
    const sel = seleccion[id];

    if (!sel.talla) {
      btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
      showToast('Elige una talla para ' + btn.dataset.nombre, true);
      return;
    }

    const producto = buscarProducto(id);
    if (!producto) { showToast('Ese producto ya no está disponible.', true); return; }

    if (tallaAgotada(producto, sel.talla)) {
      showToast(`${producto.nombre} está agotado en la talla ${sel.talla} por ahora.`, true);
      return;
    }
    const stockDisponible = Math.min(stockColor(producto, sel.color), stockTalla(producto, sel.talla));
    if (stockDisponible <= 0) {
      showToast(`${producto.nombre} está agotado en ese color por ahora.`, true);
      return;
    }
    const yaEnCarrito = getCarrito().filter(it => it.id == producto.id && it.color === sel.color && it.talla === sel.talla).length;
    if (yaEnCarrito >= stockDisponible) {
      showToast(`Ya tienes en el carrito todo el stock disponible de ${producto.nombre} en esa combinación.`, true);
      return;
    }

    const totalCarrito = agregarAlCarrito(producto, sel.color, sel.talla);

    document.getElementById('cartCount').textContent = totalCarrito;
    const pill = document.querySelector('.cart-pill');
    pill.classList.remove('pulse'); void pill.offsetWidth; pill.classList.add('pulse');

    const original = btn.textContent;
    btn.textContent = '¡Sumado! ⚡';
    btn.classList.add('added');
    setTimeout(() => { btn.textContent = original; btn.classList.remove('added'); }, 1200);

    /* si con esta unidad se agotó ESE color, se avisa en la tarjeta
       (el producto puede seguir disponible en otros colores) */
    if (yaEnCarrito + 1 >= stockDisponible) {
      const noteEl = card.querySelector('[data-stock-note]');
      if (noteEl) {
        noteEl.textContent = 'Agotado en este color';
        noteEl.style.display = 'block';
        noteEl.classList.add('stock-note-agotado');
      }
      setTimeout(() => { btn.disabled = true; btn.textContent = 'Agotado en este color'; }, 1200);
    }

    showToast(`${producto.nombre} · talla ${sel.talla} ya es tuyo ⚡`);
  });
});

/* ---- si venimos del buscador (?buscar=<id>), resaltar y hacer scroll ---- */
const buscarId = params.get('buscar');
if (buscarId) {
  const tarjeta = document.getElementById(buscarId);
  if (tarjeta) {
    [...filtersEl.children].forEach(b => b.classList.toggle('active', b.dataset.cat === 'todos'));
    document.querySelectorAll('[data-product]').forEach(c => c.classList.remove('hidden'));
    setTimeout(() => {
      tarjeta.scrollIntoView({ behavior: 'smooth', block: 'center' });
      tarjeta.classList.add('search-highlight');
      setTimeout(() => tarjeta.classList.remove('search-highlight'), 2300);
    }, 150);
  }
}

let toastTimer;
function showToast(text, esError = false) {
  const toast = document.getElementById('toast');
  document.getElementById('toastText').textContent = text;
  toast.classList.toggle('error', esError);
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
}

})();
</script>

</body>
</html>
