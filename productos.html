<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>Colección — YAS DRIP</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div id="site-header"></div>

<section class="section" id="coleccion">
  <div class="section-head reveal">
    <div>
      <div class="section-eyebrow">Catálogo completo</div>
      <h2>La colección <span class="hero-note" style="font-size:0.55em;transform:rotate(-3deg);">psst, se acaba rápido</span></h2>
    </div>
    <p>Elige color y talla directo en la tarjeta.</p>
  </div>

  <div class="filters" id="filters">
    <div class="filters-cats" id="filtersCats"></div>
    <div class="sort-wrap">
      <label for="sortSelect">Ordenar por</label>
      <select id="sortSelect" class="sort-select">
        <option value="relevancia">Relevancia</option>
        <option value="precio_asc">Más barato primero</option>
        <option value="precio_desc">Más caro primero</option>
        <option value="nuevo">Nuevo</option>
      </select>
    </div>
  </div>

  <div class="grid" id="productGrid"></div>
</section>

<div id="site-footer"></div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastText">¡Sumado a tu pedido!</span></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/icons.js"></script>
<script src="js/products.js"></script>
<script src="js/store.js"></script>
<script src="js/catalog-render.js"></script>
<script src="js/layout.js"></script>
<script>
renderHeader('productos');
renderFooter();

(async function () {
const gridEl = document.getElementById('productGrid');
gridEl.innerHTML = construirSkeletonHtml(6); // mientras carga, para no dejar la grilla en blanco

await cargarCatalogo(); // trae el catálogo de Firestore antes de pintar nada

const params = new URLSearchParams(window.location.search);
const generoInicial = params.get('genero') || null;
const productosBase = productosActivos();
const productos = generoInicial
  ? productosBase.filter(p => Array.isArray(p.genero) && p.genero.includes(generoInicial))
  : productosBase;
const categorias = Array.from(new Set(productos.map(p => p.categoria))).sort();
const etiquetaGenero = { hombre: 'Hombre', mujer: 'Mujer', nino: 'Niño', nina: 'Niña' }[generoInicial] || null;

if (etiquetaGenero) {
  document.querySelector('.section-eyebrow').textContent = 'Colección · ' + etiquetaGenero;
}

/* ---- estado de filtro de categoría + orden (se repinta el grid al cambiar) ---- */
let categoriaActual = params.get('cat') || 'todos';
let ordenActual = 'relevancia';

/* ---- construir botones de filtro ---- */
const filtersCatsEl = document.getElementById('filtersCats');
let filtrosHtml = `<button class="filter-btn ${categoriaActual === 'todos' ? 'active' : ''}" data-cat="todos">Todos</button>`;
categorias.forEach(cat => {
  filtrosHtml += `<button class="filter-btn ${categoriaActual === cat ? 'active' : ''}" data-cat="${cat}">${cat}</button>`;
});
filtersCatsEl.innerHTML = filtrosHtml;

/* ---- pinta el grid entero según categoriaActual + ordenActual ---- */
function pintarGrid() {
  let lista = categoriaActual === 'todos' ? productos : productos.filter(p => p.categoria === categoriaActual);
  lista = ordenarProductos(lista, ordenActual);

  if (lista.length === 0) {
    gridEl.innerHTML = `<div class="empty-state"><p>El próximo drop está por caer. Vuelve pronto ⚡</p></div>`;
  } else {
    gridEl.innerHTML = construirTarjetasHtml(lista);
  }
  // Las tarjetas se acaban de pintar, así que hay que decirle al
  // observador de scroll que las revise, y reactivar sus eventos.
  initScrollReveal();
  activarInteraccionGrid(gridEl);
}
pintarGrid();

/* ---- filtros de categoría ---- */
filtersCatsEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  [...filtersCatsEl.children].forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  categoriaActual = btn.dataset.cat;
  pintarGrid();
});

/* ---- orden (precio / novedad) ---- */
document.getElementById('sortSelect').addEventListener('change', (e) => {
  ordenActual = e.target.value;
  pintarGrid();
});

/* ---- si venimos del buscador (?buscar=<id>), resaltar y hacer scroll ---- */
const buscarId = params.get('buscar');
if (buscarId) {
  [...filtersCatsEl.children].forEach(b => b.classList.toggle('active', b.dataset.cat === 'todos'));
  categoriaActual = 'todos';
  pintarGrid();
  const tarjeta = document.getElementById(buscarId);
  if (tarjeta) {
    setTimeout(() => {
      tarjeta.scrollIntoView({ behavior: 'smooth', block: 'center' });
      tarjeta.classList.add('search-highlight');
      setTimeout(() => tarjeta.classList.remove('search-highlight'), 2300);
    }, 150);
  }
}

function showToast(text, esError = false) {
  mostrarToast(text, esError);
}

})();
</script>

</body>
</html>
