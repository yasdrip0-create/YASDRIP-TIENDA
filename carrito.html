<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu carrito — YAS DRIP</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div id="site-header"></div>

<section class="section">
  <div class="section-head" style="border:none;padding-bottom:0;">
    <div>
      <div class="section-eyebrow">Paso final</div>
      <h2>Tu carrito</h2>
    </div>
  </div>

  <div class="carrito-wrap" style="margin-top:30px;" id="carritoWrap">
    <!-- se rellena con JS -->
  </div>
</section>

<div id="site-footer"></div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastText">Aviso</span></div>

<div id="pago-overlay">
  <canvas id="pago-canvas"></canvas>
  <div class="pago-card">
    <div class="estado-verificando" id="estado-verificando">
      <div class="ring-wrap">
        <svg class="ring-svg" viewBox="0 0 96 96">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%"   stop-color="#1b4332"/>
              <stop offset="100%" stop-color="#4c8c68"/>
            </linearGradient>
          </defs>
          <circle class="ring-track"    cx="48" cy="48" r="44"/>
          <circle class="ring-progress" cx="48" cy="48" r="44"/>
        </svg>
        <div class="ring-icon">💳</div>
      </div>
      <div>
        <div class="pago-status" id="pago-status-txt">Comprobando pago</div>
        <div class="dots" style="margin-top:10px"><span></span><span></span><span></span></div>
      </div>
      <div class="barra-wrap" style="width:260px"><div class="barra-fill"></div></div>
    </div>

    <div class="estado-exito" id="estado-exito">
      <div class="check-circle">✅</div>
      <div class="exito-titulo">¡Pago exitoso!</div>
      <div class="exito-sub">Tu pedido fue registrado correctamente</div>
      <div class="gracias-nombre" id="gracias-nombre"></div>
      <div class="exito-pedido" id="exito-pedido"></div>
      <a href="productos.html" class="btn-exito-volver">Seguir comprando</a>
    </div>

    <div class="estado-error" id="estado-error">
      <div class="error-circle">❌</div>
      <div class="error-titulo">Error en el pago</div>
      <div class="error-msg" id="error-msg-txt"></div>
      <button class="btn-error-volver" onclick="cerrarOverlay()">↩ Volver e intentar</button>
    </div>
  </div>
</div>

<script src="js/icons.js"></script>
<script src="js/products.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>
renderHeader('carrito');
renderFooter();

/* Agrupa items idénticos (mismo id + color + talla) en uno solo con cantidad */
function agruparCarrito(carrito) {
  const grupos = [];
  carrito.forEach(item => {
    const existente = grupos.find(g => g.id == item.id && g.color === item.color && g.talla === item.talla);
    if (existente) existente.cantidad++;
    else grupos.push({ ...item, cantidad: 1 });
  });
  return grupos;
}

function pintarCarrito() {
  const carrito = getCarrito();
  const wrap = document.getElementById('carritoWrap');

  if (carrito.length === 0) {
    wrap.innerHTML = `
      <div class="empty-state">
        <p>Tu carrito está vacío. <a href="productos.html" style="color:var(--forest);font-weight:600;">Volver a la colección</a></p>
      </div>`;
    return;
  }

  const grupos = agruparCarrito(carrito);

  let itemsHtml = '';
  grupos.forEach(g => {
    itemsHtml += `
      <div class="producto-carrito">
        <div class="prod-icon-wrap">${iconoProducto(g.icono, g.color || '#dfe8da')}</div>
        <div class="producto-info">
          <h3>${g.nombre}</h3>
          <div class="producto-meta">TALLA ${g.talla || '—'} · ${g.categoria || ''}</div>
          <div class="qty-stepper">
            <button class="qty-btn qty-minus" data-id="${g.id}" data-color="${g.color}" data-talla="${g.talla}">−</button>
            <span class="qty-value">${g.cantidad}</span>
            <button class="qty-btn qty-plus" data-id="${g.id}" data-color="${g.color}" data-talla="${g.talla}">+</button>
          </div>
        </div>
        <div class="producto-precio-total mono">$${Number(g.precio * g.cantidad).toLocaleString('es-CO')}</div>
        <a href="#" class="btn-eliminar" data-id="${g.id}" data-color="${g.color}" data-talla="${g.talla}">✕</a>
      </div>`;
  });

  const total = totalCarritoValor();
  const html = `
    <div class="carrito-layout">
      <div class="carrito-items">${itemsHtml}</div>
      <div class="carrito-summary-col">
        <div class="carrito-summary-card">
          <h3>Resumen del pedido</h3>
          <div class="summary-row"><span>${carrito.length} producto${carrito.length === 1 ? '' : 's'}</span><span id="subtotalValor">$${Number(total).toLocaleString('es-CO')}</span></div>
          <div class="summary-row"><span>Envío</span><span id="envioValor">Elige tu municipio</span></div>
          <div class="carrito-total">
            <span>TOTAL</span>
            <span class="total-valor" id="totalValor">$${Number(total).toLocaleString('es-CO')}</span>
          </div>
          <a href="#" class="btn-limpiar" id="btnLimpiar">🗑 Limpiar carrito</a>
          <div class="pagar-box">
            <h2>Finalizar compra</h2>
            <form id="form-pago" novalidate>

              <div class="checkout-step open" data-step="1">
                <div class="step-header">
                  <div class="step-header-left">
                    <span class="step-num">1</span>
                    <span class="step-title">Tus datos</span>
                  </div>
                  <span class="step-summary"></span>
                </div>
                <div class="step-body">
                  <input type="text"  name="nombre_cliente" id="nombreCliente" placeholder="Nombre completo"    required>
                  <input type="email" name="email_cliente"  id="emailCliente"  placeholder="Correo electrónico" required>
                  <input type="tel"   name="telefono_cliente" id="telefonoCliente" placeholder="Teléfono / WhatsApp" required>
                  <button type="button" class="btn-continuar" data-next="2">Continuar</button>
                </div>
              </div>

              <div class="checkout-step" data-step="2">
                <div class="step-header">
                  <div class="step-header-left">
                    <span class="step-num">2</span>
                    <span class="step-title">¿A dónde lo enviamos?</span>
                  </div>
                  <span class="step-summary"></span>
                </div>
                <div class="step-body">
                  <select id="municipioEnvio" required>
                    <option value="" disabled selected>Selecciona municipio / zona</option>
                    ${zonasEnvio().map(z => `<option value="${z.id}" data-costo="${z.costo}">${z.nombre} — $${z.costo.toLocaleString('es-CO')}</option>`).join('')}
                  </select>
                  <div class="campo-fila">
                    <input type="text" id="barrioCliente" placeholder="Barrio">
                    <input type="text" id="veredaCliente" placeholder="Vereda (opcional)">
                  </div>
                  <input type="text" id="direccionCliente" placeholder="Calle / Carrera / Número" required>
                  <input type="text" id="edificioCliente" placeholder="Edificio, apto, casa, torre (opcional)">
                  <textarea id="referenciaCliente" placeholder="Indicaciones adicionales (opcional): color de la casa, cerca de..." rows="2"></textarea>
                  <button type="button" class="btn-continuar" data-next="3">Continuar</button>
                </div>
              </div>

              <div class="checkout-step" data-step="3">
                <div class="step-header">
                  <div class="step-header-left">
                    <span class="step-num">3</span>
                    <span class="step-title">¿Cómo quieres pagar?</span>
                  </div>
                  <span class="step-summary"></span>
                </div>
                <div class="step-body">
                  <div class="metodo-pago-chips">
                    <button type="button" class="metodo-chip" data-metodo="tarjeta">💳 Tarjeta</button>
                    <button type="button" class="metodo-chip" data-metodo="contraentrega">📦 Contraentrega</button>
                    <button type="button" class="metodo-chip" data-metodo="nequi">📲 Nequi / Daviplata</button>
                  </div>

                  <div class="campos-tarjeta" id="camposTarjeta">
                    <div class="tarjeta-visual" id="tarjetaVisual">
                      <div class="tarjeta-cara tarjeta-frente">
                        <div class="tarjeta-top">
                          <span class="tarjeta-chip">▮▮</span>
                          <span class="tarjeta-marca" id="tarjetaMarca">⚡ YASDRIP PAY</span>
                        </div>
                        <div class="tarjeta-numero" id="tarjetaNumeroVista">•••• •••• •••• ••••</div>
                        <div class="tarjeta-bottom">
                          <div>
                            <div class="tarjeta-mini-label">TITULAR</div>
                            <div class="tarjeta-titular" id="tarjetaTitularVista">TU NOMBRE AQUÍ</div>
                          </div>
                          <div>
                            <div class="tarjeta-mini-label">VENCE</div>
                            <div class="tarjeta-venc" id="tarjetaVencVista">MM/AA</div>
                          </div>
                        </div>
                      </div>
                      <div class="tarjeta-cara tarjeta-reverso">
                        <div class="tarjeta-banda"></div>
                        <div class="tarjeta-cvv-box">
                          <span id="tarjetaCvvVista">•••</span>
                        </div>
                      </div>
                    </div>

                    <input type="text" id="tarjetaNumero" placeholder="Número de la tarjeta" inputmode="numeric" maxlength="19">
                    <input type="text" id="tarjetaTitular" placeholder="Nombre igual que en la tarjeta">
                    <div class="campo-fila">
                      <input type="text" id="tarjetaVencimiento" placeholder="MM/AA" inputmode="numeric" maxlength="5">
                      <input type="text" id="tarjetaCvv" placeholder="CVV" inputmode="numeric" maxlength="4">
                    </div>
                    <p class="tarjeta-nota">🔒 Pago simulado — esta demo aún no está conectada a una pasarela real ni a una cuenta bancaria.</p>
                  </div>

                  <button type="submit" class="btn-pagar">Confirmar compra</button>
                </div>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>`;

  wrap.innerHTML = html;

  wrap.querySelectorAll('.qty-plus').forEach(btn => {
    btn.addEventListener('click', () => {
      const producto = buscarProducto(btn.dataset.id);
      if (!producto) return;
      agregarAlCarrito(producto, btn.dataset.color, btn.dataset.talla);
      pintarCarrito();
      document.getElementById('cartCount').textContent = totalCarritoCount();
    });
  });

  wrap.querySelectorAll('.qty-minus').forEach(btn => {
    btn.addEventListener('click', () => {
      quitarUnidad(btn.dataset.id, btn.dataset.color, btn.dataset.talla);
      pintarCarrito();
      document.getElementById('cartCount').textContent = totalCarritoCount();
    });
  });

  wrap.querySelectorAll('.btn-eliminar').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      eliminarGrupo(a.dataset.id, a.dataset.color, a.dataset.talla);
      pintarCarrito();
      document.getElementById('cartCount').textContent = totalCarritoCount();
    });
  });

  const btnLimpiar = document.getElementById('btnLimpiar');
  if (btnLimpiar) {
    btnLimpiar.addEventListener('click', (e) => {
      e.preventDefault();
      limpiarCarrito();
      pintarCarrito();
      document.getElementById('cartCount').textContent = 0;
    });
  }

  /* ---- envío dinámico según municipio elegido ---- */
  const selectMunicipio = document.getElementById('municipioEnvio');
  const envioValorEl = document.getElementById('envioValor');
  const totalValorEl = document.getElementById('totalValor');
  let envioActual = 0;

  if (selectMunicipio) {
    selectMunicipio.addEventListener('change', () => {
      const opt = selectMunicipio.selectedOptions[0];
      envioActual = opt ? Number(opt.dataset.costo || 0) : 0;
      envioValorEl.textContent = envioActual ? `$${envioActual.toLocaleString('es-CO')}` : 'Elige tu municipio';
      totalValorEl.textContent = `$${Number(total + envioActual).toLocaleString('es-CO')}`;
    });
  }

  /* ---- acordeón de pasos del checkout ---- */
  const steps = wrap.querySelectorAll('.checkout-step');

  function refrescarNum(step) {
    const numEl = step.querySelector('.step-num');
    numEl.textContent = step.classList.contains('done') ? '✓' : step.dataset.step;
  }

  function activarPaso(n) {
    steps.forEach(s => {
      s.classList.toggle('open', Number(s.dataset.step) === n);
      refrescarNum(s);
    });
  }

  steps.forEach(step => {
    step.querySelector('.step-header').addEventListener('click', () => {
      activarPaso(Number(step.dataset.step));
    });
  });

  const btnContinuar1 = wrap.querySelector('.checkout-step[data-step="1"] .btn-continuar');
  if (btnContinuar1) {
    btnContinuar1.addEventListener('click', () => {
      const step = btnContinuar1.closest('.checkout-step');
      const nombre = document.getElementById('nombreCliente').value.trim();
      const email = document.getElementById('emailCliente').value.trim();
      const telefono = document.getElementById('telefonoCliente').value.trim();
      if (!nombre || !email || !telefono) {
        showToastCarrito('Completa tus datos de contacto antes de continuar.');
        return;
      }
      step.classList.add('done');
      step.querySelector('.step-summary').textContent = nombre;
      activarPaso(2);
    });
  }

  const btnContinuar2 = wrap.querySelector('.checkout-step[data-step="2"] .btn-continuar');
  if (btnContinuar2) {
    btnContinuar2.addEventListener('click', () => {
      const step = btnContinuar2.closest('.checkout-step');
      const sel = document.getElementById('municipioEnvio');
      const direccion = document.getElementById('direccionCliente').value.trim();
      if (!sel.value) {
        showToastCarrito('Elige el municipio o zona a donde enviamos tu pedido.');
        return;
      }
      if (!direccion) {
        showToastCarrito('Escribe la dirección de entrega (calle / carrera / número).');
        return;
      }
      step.classList.add('done');
      step.querySelector('.step-summary').textContent = sel.selectedOptions[0].textContent.split(' — ')[0];
      activarPaso(3);
    });
  }

  wrap.querySelectorAll('.checkout-step[data-step="1"] input, .checkout-step[data-step="2"] input').forEach(inp => {
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); e.target.closest('.checkout-step').querySelector('.btn-continuar').click(); }
    });
  });

  /* ---- selector de método de pago ---- */
  let metodoPago = null;
  const chips = wrap.querySelectorAll('.metodo-chip');
  const camposTarjeta = document.getElementById('camposTarjeta');
  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      metodoPago = chip.dataset.metodo;
      camposTarjeta.classList.toggle('open', metodoPago === 'tarjeta');
    });
  });

  /* ---- tarjeta animada: formateo en vivo + flip al CVV ---- */
  const inNumero = document.getElementById('tarjetaNumero');
  const inTitular = document.getElementById('tarjetaTitular');
  const inVenc = document.getElementById('tarjetaVencimiento');
  const inCvv = document.getElementById('tarjetaCvv');
  const tarjetaVisual = document.getElementById('tarjetaVisual');

  if (inNumero) {
    inNumero.addEventListener('input', () => {
      let v = inNumero.value.replace(/\D/g, '').slice(0, 16);
      inNumero.value = v.replace(/(.{4})/g, '$1 ').trim();
      document.getElementById('tarjetaNumeroVista').textContent = v
        ? v.padEnd(16, '•').replace(/(.{4})/g, '$1 ').trim()
        : '•••• •••• •••• ••••';
    });
  }
  if (inTitular) {
    inTitular.addEventListener('input', () => {
      document.getElementById('tarjetaTitularVista').textContent = inTitular.value.trim().toUpperCase() || 'TU NOMBRE AQUÍ';
    });
  }
  if (inVenc) {
    inVenc.addEventListener('input', () => {
      let v = inVenc.value.replace(/\D/g, '').slice(0, 4);
      if (v.length > 2) v = v.slice(0, 2) + '/' + v.slice(2);
      inVenc.value = v;
      document.getElementById('tarjetaVencVista').textContent = v || 'MM/AA';
    });
  }
  if (inCvv) {
    inCvv.addEventListener('input', () => {
      inCvv.value = inCvv.value.replace(/\D/g, '').slice(0, 4);
      document.getElementById('tarjetaCvvVista').textContent = inCvv.value.padEnd(3, '•');
    });
    inCvv.addEventListener('focus', () => tarjetaVisual.classList.add('flip'));
    inCvv.addEventListener('blur', () => tarjetaVisual.classList.remove('flip'));
  }

  const formPago = document.getElementById('form-pago');
  if (formPago) {
    formPago.addEventListener('submit', (e) => {
      e.preventDefault();
      const nombre = document.getElementById('nombreCliente').value.trim();
      const email  = document.getElementById('emailCliente').value.trim();
      const telefono = document.getElementById('telefonoCliente').value.trim();
      const municipioOpt = selectMunicipio ? selectMunicipio.selectedOptions[0] : null;
      const municipio = selectMunicipio ? selectMunicipio.value : '';
      const barrio = document.getElementById('barrioCliente').value.trim();
      const vereda = document.getElementById('veredaCliente').value.trim();
      const direccion = document.getElementById('direccionCliente').value.trim();
      const edificio = document.getElementById('edificioCliente').value.trim();
      const referencia = document.getElementById('referenciaCliente').value.trim();

      if (!nombre || !email || !telefono) {
        showToastCarrito('Completa tus datos de contacto antes de pagar.');
        return;
      }
      if (!municipio) {
        showToastCarrito('Elige el municipio o zona a donde enviamos tu pedido.');
        return;
      }
      if (!direccion) {
        showToastCarrito('Escribe la dirección de entrega (calle / carrera / número).');
        return;
      }
      if (!metodoPago) {
        showToastCarrito('Elige un método de pago.');
        return;
      }
      let tarjetaFinal = null;
      if (metodoPago === 'tarjeta') {
        const numLimpio = inNumero.value.replace(/\D/g, '');
        if (numLimpio.length < 16 || !inTitular.value.trim() || inVenc.value.length < 5 || inCvv.value.length < 3) {
          showToastCarrito('Revisa los datos de tu tarjeta.');
          return;
        }
        tarjetaFinal = numLimpio.slice(-4);
      }

      const envio = {
        municipio: municipioOpt ? municipioOpt.textContent.split(' — ')[0] : municipio,
        costo: envioActual,
        barrio, vereda, direccion, edificio, referencia,
      };

      mostrarOverlay();
      setTimeout(() => {
        const pedido = crearPedido({ nombre, email, telefono, metodoPago, tarjetaFinal, envio });
        if (pedido) {
          mostrarExito(nombre, pedido.id);
          document.getElementById('cartCount').textContent = 0;
        } else {
          mostrarError('No se pudo procesar tu pedido, intenta de nuevo.');
        }
      }, 1600);
    });
  }
}

function showToastCarrito(texto) {
  const toast = document.getElementById('toast');
  if (!toast) { alert(texto); return; }
  document.getElementById('toastText').textContent = texto;
  toast.classList.add('error', 'show');
  clearTimeout(window._toastTimerCarrito);
  window._toastTimerCarrito = setTimeout(() => toast.classList.remove('show', 'error'), 2600);
}

pintarCarrito();

/* ---- animación de "pago" (igual que en el proyecto original) ---- */
function mostrarOverlay() {
  const overlay = document.getElementById('pago-overlay');
  overlay.classList.add('activo');
  iniciarParticulas();
  const msgs = ['Comprobando pago','Verificando datos','Procesando...','Validando pago'];
  let mi = 0;
  const st = document.getElementById('pago-status-txt');
  overlay._iv = setInterval(() => { st.textContent = msgs[++mi % msgs.length]; }, 700);
}

function cerrarOverlay() {
  const overlay = document.getElementById('pago-overlay');
  clearInterval(overlay._iv);
  overlay.classList.remove('activo');
  document.getElementById('estado-verificando').style.cssText = 'display:flex;opacity:1;';
  document.getElementById('estado-exito').style.display = 'none';
  document.getElementById('estado-error').style.display = 'none';
}

function mostrarExito(nombreCliente, pedidoId) {
  clearInterval(document.getElementById('pago-overlay')._iv);
  const ver = document.getElementById('estado-verificando');
  ver.style.transition = 'opacity 0.4s'; ver.style.opacity = '0';
  setTimeout(() => {
    ver.style.display = 'none';
    const ex = document.getElementById('estado-exito');
    ex.style.display = 'flex';
    document.getElementById('gracias-nombre').textContent = '✨ ¡Muchas gracias, ' + nombreCliente + '! ✨';
    document.getElementById('exito-pedido').textContent = pedidoId ? `PEDIDO #${pedidoId}` : 'PEDIDO REGISTRADO';
    lanzarConfeti();
    pintarCarrito();
  }, 400);
}

function mostrarError(msg) {
  clearInterval(document.getElementById('pago-overlay')._iv);
  const ver = document.getElementById('estado-verificando');
  ver.style.transition = 'opacity 0.4s'; ver.style.opacity = '0';
  setTimeout(() => {
    ver.style.display = 'none';
    document.getElementById('estado-error').style.display = 'flex';
    document.getElementById('error-msg-txt').textContent = msg;
  }, 400);
}

function iniciarParticulas() {
  const canvas = document.getElementById('pago-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = innerWidth; canvas.height = innerHeight;
  const pts = Array.from({length:40}, () => ({
    x: Math.random()*canvas.width, y: Math.random()*canvas.height,
    r: Math.random()*1.4+0.3, vx: (Math.random()-0.5)*0.5, vy: (Math.random()-0.5)*0.5,
    a: Math.random()*0.4+0.1
  }));
  (function frame() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pts.forEach(p => {
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(27,67,50,${p.a})`; ctx.fill();
      p.x += p.vx; p.y += p.vy;
      if (p.x<0||p.x>canvas.width) p.vx*=-1;
      if (p.y<0||p.y>canvas.height) p.vy*=-1;
    });
    if (document.getElementById('pago-overlay').classList.contains('activo')) requestAnimationFrame(frame);
  })();
}

function lanzarConfeti() {
  const colores = ['#1b4332','#4c8c68','#dfe8da','#f3e0da','#f5ecd6','#d9a441'];
  const card = document.querySelector('.pago-card');
  for (let i=0; i<50; i++) setTimeout(() => {
    const d = document.createElement('div');
    d.className = 'confeti-dot';
    d.style.cssText = `left:${Math.random()*100}%;top:${5+Math.random()*25}%;background:${colores[Math.floor(Math.random()*colores.length)]};animation-delay:${Math.random()*0.6}s;width:${5+Math.random()*9}px;height:${5+Math.random()*9}px;border-radius:${Math.random()>.5?'50%':'2px'};`;
    card.appendChild(d);
    setTimeout(() => d.remove(), 2400);
  }, i*35);
}
</script>

</body>
</html>
