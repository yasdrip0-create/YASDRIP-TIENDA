<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta — YAS DRIP</title>
<link rel="stylesheet" href="css/estilos.css">
<style>
/* ---- personaje est\u00e1tico (sin animaci\u00f3n) ---- */
.auth-figure svg{ overflow:visible; }
</style>
</head>
<body>

<div class="auth-page">

  <div class="auth-visual">
    <a href="index.html" class="nav-logo">
      <span class="logo-mark">⚡</span><span class="logo-text display">YAS<em>DRIP</em></span>
    </a>

    <div class="auth-copy">
      <div class="auth-eyebrow">Nuevo aquí</div>
      <h1>Únete a la gente que <em>ya trae su drip</em>.</h1>
      <p>Crea tu cuenta para guardar tus pedidos, entrar al Voltage Club y no perderte ningún drop.</p>
    </div>

    <div class="auth-stamp stamp-font">underground<br>drip co.</div>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <a href="index.html" class="auth-brand">
        <span class="logo-mark">⚡</span><span class="display">YAS<em>DRIP</em></span>
      </a>

      <h2>Crear cuenta</h2>
      <p class="auth-sub">Toma menos de un minuto.</p>

      <div id="authMsg"></div>

      <form id="formRegistro">
        <div class="auth-field">
          <input type="text" id="nombreInput" placeholder="Nombre completo" required>
        </div>
        <div class="auth-field">
          <input type="email" id="correoInput" placeholder="tu@correo.com" required>
        </div>
        <div class="auth-field-row">
          <div class="auth-field">
            <label style="color:var(--gray);font-size:.78rem;margin-bottom:4px;display:block;">Fecha de nacimiento</label>
            <input type="date" id="fechaNacimientoInput" required>
          </div>
          <div class="auth-field">
            <label style="color:var(--gray);font-size:.78rem;margin-bottom:4px;display:block;">País</label>
            <select id="paisInput" required>
              <option value="" disabled selected>— Selecciona —</option>
              <option>Colombia</option>
              <option>México</option>
              <option>Argentina</option>
              <option>Chile</option>
              <option>Perú</option>
              <option>Ecuador</option>
              <option>España</option>
              <option>Estados Unidos</option>
              <option>Otro</option>
            </select>
          </div>
        </div>
        <div class="auth-field">
          <input type="password" id="contrasenaInput" placeholder="Contraseña (mín. 6 caracteres)" required>
        </div>
        <button type="submit" class="btn btn-primary auth-submit">Crear cuenta</button>
      </form>

      <div class="auth-divider">o</div>

      <a href="login.html" class="btn btn-ghost auth-signup">Ya tengo cuenta</a>

      <p class="auth-footnote">Al crear tu cuenta aceptas nuestros <a href="servicios.html">términos de servicio</a>.</p>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/store.js"></script>
<script>
document.getElementById('formRegistro').addEventListener('submit', async function (e) {
  e.preventDefault();
  const nombre = document.getElementById('nombreInput').value.trim();
  const correo = document.getElementById('correoInput').value.trim();
  const fechaNacimiento = document.getElementById('fechaNacimientoInput').value;
  const pais = document.getElementById('paisInput').value;
  const contrasena = document.getElementById('contrasenaInput').value;
  const msgEl = document.getElementById('authMsg');
  const btn = e.target.querySelector('button[type="submit"]');

  const correoValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo);
  if (!nombre || !correoValido || !fechaNacimiento || !pais || contrasena.length < 6) {
    msgEl.innerHTML = `<div class="auth-error">Revisa tus datos: nombre, correo válido, fecha de nacimiento, país y contraseña de al menos 6 caracteres.</div>`;
    return;
  }

  msgEl.innerHTML = '';
  btn.disabled = true;
  btn.textContent = 'Creando cuenta...';

  const res = await registrarUsuario(nombre, correo, contrasena, fechaNacimiento, pais);
  if (res.ok) {
    window.location.href = 'productos.html';
  } else {
    msgEl.innerHTML = `<div class="auth-error">${res.msg}</div>`;
    btn.disabled = false;
    btn.textContent = 'Crear cuenta';
  }
});
</script>

</body>
</html>
