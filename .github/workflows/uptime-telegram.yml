name: Avisos de caída por Telegram (UptimeRobot)

# Se ejecuta cada 5 minutos, gratis, en los servidores de GitHub —
# no necesita que la tienda ni ningún otro sitio esté prendidos.
# Revisa el estado de tus monitores en UptimeRobot usando su API
# GRATUITA (de solo lectura) y solo escribe a Telegram cuando un
# monitor CAMBIA de estado (de arriba a caído, o de caído a arriba),
# para no mandar el mismo aviso cada 5 minutos.
#
# ------------------------------------------------------------------
# CONFIGURACIÓN (una sola vez):
#
# 1) API Key de UptimeRobot (gratis, no requiere plan de pago):
#    dashboard.uptimerobot.com -> Integrations & API -> pestaña "API"
#    -> copia la "Main API Key".
#
# 2) Token y chat_id de tu bot de Telegram:
#    - Si ya tienes un bot (el mismo que usa Google Apps Script para
#      avisar pedidos de la tienda), puedes reusar el mismo token.
#    - Si no, escríbele a @BotFather en Telegram -> /newbot -> te da
#      un token como "123456:ABC-DEF...".
#    - Para el chat_id: escríbele cualquier mensaje a tu bot, luego
#      abre en el navegador
#      https://api.telegram.org/bot<TU_TOKEN>/getUpdates
#      y busca el número "id" dentro de "chat".
#
# 3) En tu repo de GitHub: Settings -> Secrets and variables ->
#    Actions -> "New repository secret" y crea estos 3:
#      UPTIMEROBOT_API_KEY
#      TELEGRAM_BOT_TOKEN
#      TELEGRAM_CHAT_ID
#
# Con eso ya queda funcionando solo, sin pagar el plan de
# UptimeRobot que pide la integración nativa de Telegram.
# ------------------------------------------------------------------

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos
  workflow_dispatch: {}       # botón "Run workflow" manual, para probar

permissions:
  contents: write

jobs:
  chequear:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Consultar UptimeRobot y avisar por Telegram si algo cambió
        env:
          UPTIMEROBOT_API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          ARCHIVO_ESTADO=".github/uptime-last-status.json"
          mkdir -p .github

          # 1) Trae el estado actual de todos los monitores
          RESPUESTA=$(curl -s -X POST "https://api.uptimerobot.com/v2/getMonitors" \
            -d "api_key=${UPTIMEROBOT_API_KEY}" \
            -d "format=json")

          # 2) Deja solo id, nombre y estado (2=activo, 9=caído, 8=parece caído)
          ACTUAL=$(echo "$RESPUESTA" | jq -c '[.monitors[] | {id, friendly_name, status}] | sort_by(.id)')

          if [ -z "$ACTUAL" ] || [ "$ACTUAL" == "null" ]; then
            echo "No se pudo leer la respuesta de UptimeRobot. Revisa la API key."
            echo "$RESPUESTA"
            exit 0
          fi

          # 3) Compara contra el estado guardado la última vez
          if [ -f "$ARCHIVO_ESTADO" ]; then
            ANTERIOR=$(cat "$ARCHIVO_ESTADO")
          else
            ANTERIOR="[]"
          fi

          if [ "$ACTUAL" == "$ANTERIOR" ]; then
            echo "Sin cambios de estado. No se manda nada."
            exit 0
          fi

          # 4) Por cada monitor que cambió, arma y manda un mensaje a Telegram
          echo "$ACTUAL" | jq -c '.[]' | while read -r monitor; do
            id=$(echo "$monitor" | jq -r '.id')
            nombre=$(echo "$monitor" | jq -r '.friendly_name')
            estado=$(echo "$monitor" | jq -r '.status')
            anterior_de_este=$(echo "$ANTERIOR" | jq -r --arg id "$id" '.[] | select(.id == ($id | tonumber)) | .status' 2>/dev/null || echo "")

            if [ "$estado" != "$anterior_de_este" ]; then
              if [ "$estado" == "2" ]; then
                MSG="✅ *$nombre* volvió a estar arriba."
              elif [ "$estado" == "9" ] || [ "$estado" == "8" ]; then
                MSG="🔴 *$nombre* está caído."
              else
                MSG="ℹ️ *$nombre* cambió de estado (código $estado)."
              fi
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                -d "parse_mode=Markdown" \
                -d "text=${MSG}" > /dev/null
            fi
          done

          # 5) Guarda el estado nuevo para la próxima comparación
          echo "$ACTUAL" > "$ARCHIVO_ESTADO"

      - name: Guardar el estado más reciente en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/uptime-last-status.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Actualiza estado de UptimeRobot"
          git push
